use_gazebo: true

## Properties of incoming commands
command_in_type: "speed_units"  # m/s and rad/s
scale:
  linear: 0.6
  rotational: 0.3
  joint: 0.01
low_pass_filter_coeff: 2.
low_latency_mode: false

## Properties of outgoing commands
publish_period: 0.034  # ~30Hz
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Output topic
command_out_topic: /effort_joint_trajectory_controller/command

## MoveIt properties
move_group_name: panda_arm
planning_frame: panda_link0
ee_frame_name: panda_link8
robot_link_command_frame: panda_link0

## Topic names
cartesian_command_in_topic: delta_twist_cmds
joint_command_in_topic: delta_joint_cmds
joint_topic: /joint_states
status_topic: status

## Stopping behaviour
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Singularities and joint limits
lower_singularity_threshold: 17
hard_stop_singularity_threshold: 30
joint_limit_margin: 0.1

## Collision checking
check_collisions: true
collision_check_rate: 30
collision_check_type: threshold_distance
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.05
collision_distance_safety_factor: 1000
min_allowable_collision_distance: 0.01
